name: budget_padmanaban
description: "AI-Powered Expense & Budget Tracker - Android & iOS only"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  
  # Supabase Backend
  supabase_flutter: ^2.5.0
  
  # State Management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  
  # Image Handling (Mobile only)
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  
  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1
  
  # Google Sign In (Android & iOS)
  google_sign_in: ^6.2.1
  
  # Utilities
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  
  # AI & ML - Mobile only (OCR for receipts)
  google_ml_kit: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  
  # App Icon and Splash - Mobile only
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/

# App Icon Configuration (Android & iOS only)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#6366F1"
  
# Splash Screen Configuration (Android & iOS only)  
flutter_native_splash:
  color: "#6366F1"
  android: true
  ios: true
  web: false

